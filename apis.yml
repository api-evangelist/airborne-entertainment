name: Airborne Entertainment
description: 'Airborne Entertainment was a Montreal, Quebec mobile entertainment company
  founded in 2000 that published and distributed premium mobile content and applications
  for carrier decks and early smartphones, including games, ringtones, ring-back tones,
  images, video and informational content, often under licensed consumer brands. The
  company raised a $22M round in July 2004 with participation from Insight Partners
  and Verizon, sold a majority stake to Japan''s CYBIRD Co., Ltd. in 2005, was taken
  back by management in a 2008 buy-out, operated afterwards as Airborne Mobile, and
  was acquired by Bandsintown in October 2010. It no longer operates as an independent
  company: both airborneentertainment.com and airbornemobile.com are parked domain-sale
  listings, and the company never published a public developer portal, API, or SDK
  surface. This profile is retained as an API Evangelist network history record.'
